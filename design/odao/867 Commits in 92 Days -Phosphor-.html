<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>867 Commits in 92 Days — ODAO Workshop</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap');

/* ═══════════════════════════════════════════════════════
   PHOSPHOR — CRT terminal theme for ODAO workshop decks
   ═══════════════════════════════════════════════════════ */

:root {
  --bg: #060908;
  --surface: rgba(63, 245, 131, 0.045);
  --surface-2: rgba(63, 245, 131, 0.09);
  --code-bg: rgba(18, 56, 35, 0.14);
  --border: #16402A;
  --border-bright: #1F6B3E;

  --grn: #3FF583;
  --grn-dim: #2E9659;
  --grn-dark: #1F6B3E;
  --amb: #FFBE55;
  --redp: #FF7A6B;
  --mint: #A7F0C8;
  --ink: #C8E8D2;
  --dim: #6E8A78;

  /* legacy aliases used by slide markup */
  --text: var(--ink);
  --text-dim: var(--dim);
  --accent: var(--grn);
  --accent-glow: rgba(63, 245, 131, 0.25);
  --green: var(--grn);
  --amber: var(--amb);
  --red: var(--redp);
  --cyan: var(--mint);
  --pink: var(--amb);

  --glow-grn: 0 0 12px rgba(63, 245, 131, 0.35), 0 0 44px rgba(63, 245, 131, 0.12);
  --glow-amb: 0 0 12px rgba(255, 190, 85, 0.30);

  --slide-padding: clamp(2rem, 5vw, 5.5rem);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: 'IBM Plex Mono', monospace;
  -webkit-font-smoothing: antialiased;
}

/* CRT scanlines + vignette over everything */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 500;
  pointer-events: none;
  background:
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0) 0 2px, rgba(0, 0, 0, 0.22) 2px 3px),
    radial-gradient(ellipse at center, transparent 58%, rgba(0, 0, 0, 0.42) 100%);
}
@media print { body::after { display: none; } }

/* ───────── chrome ───────── */

#progress-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: rgba(31, 107, 62, 0.25);
  z-index: 110;
}

#progress-fill {
  height: 100%;
  width: 0%;
  background: var(--grn);
  box-shadow: var(--glow-grn);
  transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

#topbar {
  position: fixed;
  top: 2px; left: 0; right: 0;
  height: 2.6rem;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.6rem;
  border-bottom: 1px solid var(--border);
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--grn-dim);
  background: rgba(6, 9, 8, 0.72);
}

#topbar .path, #topbar .right, #topbar .live { white-space: nowrap; }
#topbar .right { display: flex; align-items: center; gap: 1.4rem; }
#topbar .live { color: var(--grn); text-shadow: var(--glow-grn); }

#deck { width: 100%; height: 100%; position: relative; }

.slide {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: safe center;
  padding: var(--slide-padding);
  padding-top: calc(var(--slide-padding) + 1.2rem);
  opacity: 0;
  transform: translateX(60px);
  transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
  overflow-y: auto;
}

.slide.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
.slide.exiting { opacity: 0; transform: translateX(-60px); }

/* staggered phosphor boot-in for slide content */
@media (prefers-reduced-motion: no-preference) {
  .slide.booting > div > * { animation: bootIn 0.45s cubic-bezier(0.2, 0.8, 0.3, 1) both; }
  .slide.booting > div > *:nth-child(1) { animation-delay: 0.05s; }
  .slide.booting > div > *:nth-child(2) { animation-delay: 0.13s; }
  .slide.booting > div > *:nth-child(3) { animation-delay: 0.21s; }
  .slide.booting > div > *:nth-child(4) { animation-delay: 0.29s; }
  .slide.booting > div > *:nth-child(5) { animation-delay: 0.37s; }
  .slide.booting > div > *:nth-child(6) { animation-delay: 0.45s; }
  .cursor { animation: crtblink 1.1s steps(1) infinite; }
}

@keyframes bootIn {
  0%   { opacity: 0; transform: translateY(16px); filter: brightness(2.2); }
  60%  { opacity: 0.75; }
  100% { opacity: 1; transform: none; filter: none; }
}

@keyframes crtblink { 50% { opacity: 0; } }

.cursor {
  display: inline-block;
  width: 0.55em;
  height: 0.88em;
  background: var(--grn);
  box-shadow: var(--glow-grn);
  vertical-align: -0.04em;
  margin-left: 0.18em;
}

/* ───────── typography ───────── */

h1 {
  font-size: clamp(2.3rem, 4.6vw, 4rem);
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  color: var(--grn);
  text-shadow: var(--glow-grn);
  margin-bottom: 1rem;
}

h2 {
  font-size: clamp(1.55rem, 3vw, 2.5rem);
  font-weight: 700;
  line-height: 1.15;
  text-transform: uppercase;
  color: var(--grn);
  text-shadow: var(--glow-grn);
  margin-bottom: 1.4rem;
}

h2::before { content: "> "; color: var(--grn-dark); text-shadow: none; }

h3 {
  font-size: clamp(1rem, 1.6vw, 1.3rem);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 1rem;
  color: var(--amb);
}

h3::before { content: "## "; color: var(--grn-dark); }

p, li {
  font-size: clamp(0.95rem, 1.35vw, 1.15rem);
  line-height: 1.7;
  color: var(--dim);
}

.subtitle {
  font-size: clamp(1rem, 1.7vw, 1.3rem);
  color: var(--dim);
  margin-bottom: 2rem;
}

.accent { color: var(--grn); text-shadow: var(--glow-grn); }
.green  { color: var(--grn); }
.amber  { color: var(--amb); }
.red    { color: var(--redp); }
.cyan   { color: var(--mint); }
.pink   { color: var(--amb); }
.dim    { color: var(--dim); }
.bright { color: var(--ink); }
.bold   { font-weight: 700; }
.mono   { font-family: 'IBM Plex Mono', monospace; }

/* ───────── layout helpers ───────── */

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: start; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2rem; }
.center { text-align: center; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 1rem; }
.mt-1 { margin-top: 1rem; } .mt-2 { margin-top: 2rem; } .mt-3 { margin-top: 3rem; }
.mb-1 { margin-bottom: 1rem; } .mb-2 { margin-bottom: 2rem; }

/* ───────── code ───────── */

pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  padding: 1.2rem 1.5rem;
  overflow-x: auto;
  font-size: clamp(0.7rem, 1vw, 0.88rem);
  line-height: 1.65;
  color: var(--ink);
  margin: 1rem 0;
}

code {
  background: var(--surface-2);
  padding: 0.12em 0.4em;
  font-size: 0.9em;
  color: var(--grn);
}

pre code { background: none; padding: 0; font-size: inherit; color: inherit; }

/* syntax — phosphor */
.kw   { color: var(--amb); }
.fn   { color: var(--grn); font-weight: 700; }
.str  { color: var(--amb); }
.num  { color: var(--grn); }
.cm   { color: var(--dim); font-style: italic; }
.type { color: var(--mint); }
.op   { color: var(--dim); }
.prop { color: var(--grn); }

/* ───────── cards ───────── */

.card {
  background: var(--surface);
  border: 1px dashed var(--border-bright);
  padding: 1.4rem;
}

.card h3 { margin-bottom: 0.5rem; }
.card p { font-size: 0.92rem; }
.card-glow { border-style: solid; border-color: var(--grn); box-shadow: 0 0 24px var(--accent-glow); }

/* ───────── tier diagram ───────── */

.tier-stack { display: flex; flex-direction: column; gap: 0.55rem; max-width: 700px; }

.tier {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.9rem 1.3rem;
  border: 1px solid var(--border);
  background: var(--surface);
  transition: all 0.25s ease;
}

.tier:hover { border-color: var(--grn); transform: translateX(8px); box-shadow: 0 0 18px var(--accent-glow); }

.tier-num {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--bg);
  background: var(--grn);
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.tier-label { font-weight: 700; font-size: 1.05rem; color: var(--ink); }
.tier-desc { font-size: 0.8rem; color: var(--dim); }

/* ───────── pipeline flow ───────── */

.pipeline { display: flex; align-items: center; gap: 0; flex-wrap: wrap; justify-content: center; margin: 1.5rem 0; }

.pipeline-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0.8rem 1.2rem;
  background: var(--surface);
  border: 1px solid var(--border);
  min-width: 90px;
  transition: all 0.25s ease;
}

.pipeline-step:hover { border-color: var(--grn); transform: translateY(-4px); box-shadow: 0 0 20px var(--accent-glow); }

.pipeline-step .step-icon { font-size: 1.4rem; margin-bottom: 0.3rem; color: var(--grn); }
.pipeline-step .step-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink); }
.pipeline-step .step-detail { font-size: 0.62rem; color: var(--dim); margin-top: 0.2rem; }
.pipeline-arrow { font-size: 1.1rem; color: var(--grn-dark); padding: 0 0.4rem; }

/* ───────── stats ───────── */

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1rem;
  margin: 1.5rem 0;
}

.stat { text-align: center; padding: 1rem; background: none; border: none; overflow: hidden; }

.stat-value {
  font-size: clamp(1.5rem, 3.4vw, 2.3rem);
  font-weight: 700;
  color: var(--grn);
  text-shadow: var(--glow-grn);
  line-height: 1.25;
}

.stat-value::before { content: "[ "; color: var(--grn-dark); font-weight: 400; text-shadow: none; }
.stat-value::after  { content: " ]"; color: var(--grn-dark); font-weight: 400; text-shadow: none; }

.stat-label {
  font-size: 0.74rem;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  margin-top: 0.4rem;
}

/* ───────── agent roster (legacy) ───────── */

.agent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
.agent-card { padding: 1rem; background: var(--surface); border: 1px solid var(--border); text-align: center; transition: all 0.25s ease; }
.agent-card:hover { border-color: var(--grn); }
.agent-name { font-weight: 700; font-size: 1.05rem; color: var(--grn); }
.agent-role { font-size: 0.78rem; color: var(--dim); margin-top: 0.2rem; }
.agent-origin { font-size: 0.68rem; color: var(--dim); font-style: italic; margin-top: 0.3rem; }

/* ───────── timeline (legacy) ───────── */

.timeline { position: relative; padding-left: 2rem; margin: 1rem 0; }
.timeline::before { content: ''; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--border); }
.timeline-item { position: relative; padding: 0.5rem 0 0.5rem 1.5rem; }
.timeline-item::before { content: ''; position: absolute; left: -1.5rem; top: 0.85rem; width: 10px; height: 10px; background: var(--grn); border: 2px solid var(--bg); }
.timeline-item.feat::before { background: var(--grn); }
.timeline-item.fix::before { background: var(--redp); }
.timeline-item.diag::before { background: var(--amb); }
.timeline-item.evolve::before { background: var(--mint); }
.timeline-time { font-size: 0.7rem; color: var(--dim); }
.timeline-label { font-size: 0.9rem; font-weight: 700; }

/* ───────── insight list ───────── */

.insight-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
  margin: 1rem 0;
}

.insight-list li {
  background: none;
  border: none;
  padding: 0.15rem 0 0.15rem 1.5rem;
  position: relative;
  font-size: 0.92rem;
  color: var(--dim);
}

.insight-list li::before {
  content: ">";
  position: absolute;
  left: 0;
  color: var(--grn-dark);
  font-weight: 700;
}

.insight-list li .bold { color: var(--ink); }

/* ───────── section divider ───────── */

.section-divider { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
.section-divider h1 { color: var(--grn); text-shadow: var(--glow-grn); }

/* ───────── merkle tree ───────── */

.merkle-tree { display: flex; justify-content: center; margin: 1.5rem 0; }
.merkle-tree svg { max-width: 100%; height: auto; }

/* ───────── compression math ───────── */

.math-flow {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  justify-content: center;
  margin: 1rem 0;
  font-size: 1.05rem;
}

.math-box { padding: 0.5rem 1rem; background: var(--surface); border: 1px solid var(--border); text-align: center; }
.math-op { font-weight: 700; font-size: 1.2rem; }

/* ───────── part label ───────── */

.part-label {
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.28em;
  color: var(--amb);
  margin-bottom: 0.7rem;
}

.part-label::before { content: "// "; color: var(--grn-dark); }

/* ───────── keyboard hint ───────── */

.key-hint {
  position: fixed;
  bottom: 1.2rem;
  left: 1.6rem;
  font-size: 0.7rem;
  color: var(--dim);
  z-index: 100;
  opacity: 0.55;
  transition: opacity 0.3s;
  letter-spacing: 0.08em;
}

.key-hint:hover { opacity: 1; }

/* ───────── responsive ───────── */

@media (max-width: 768px) {
  .two-col, .three-col { grid-template-columns: 1fr; }
  .pipeline { flex-direction: column; }
  .pipeline-arrow { transform: rotate(90deg); }
}

</style>
</head>

  <div id="progress-bar"><div id="progress-fill"></div></div>

const deck = document.getElementById('deck')
const progressFill = document.getElementById('progress-fill')
const counter = document.getElementById('topbar-counter')

let current = 0
const total = slides.length

const pad = (n) => String(n).padStart(2, '0')

function renderSlides() {
  deck.innerHTML = slides.map((html, i) =>
    `<div class="slide ${i === 0 ? 'active booting' : ''}" data-index="${i}" data-screen-label="${pad(i + 1)}">${html}</div>`
  ).join('')

  setTimeout(() => deck.querySelector('.slide').classList.remove('booting'), 1100)

  document.body.insertAdjacentHTML('beforeend',
    `<div class="key-hint">← → navigate &nbsp;|&nbsp; space = next</div>`
  )

  updateProgress()
}

function goTo(index) {
  if (index < 0 || index >= total || index === current) return

  const slideEls = document.querySelectorAll('.slide')
  const leaving = slideEls[current]
  const entering = slideEls[index]

  leaving.classList.remove('active')
  leaving.classList.add('exiting')

  entering.style.transform = index > current ? 'translateX(60px)' : 'translateX(-60px)'
  entering.offsetHeight
  entering.classList.add('active', 'booting')
  entering.style.transform = ''
  setTimeout(() => entering.classList.remove('booting'), 1100)

  setTimeout(() => leaving.classList.remove('exiting'), 500)

  current = index
  updateProgress()
}

function updateProgress() {
  const pct = ((current + 1) / total) * 100
  progressFill.style.width = `${pct}%`
  if (counter) counter.textContent = `${pad(current + 1)} / ${pad(total)}`
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault()
    goTo(current + 1)
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault()
    goTo(current - 1)
  } else if (e.key === 'Home') {
    goTo(0)
  } else if (e.key === 'End') {
    goTo(total - 1)
  }
})

let touchStartX = 0
document.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX })
document.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX
  if (Math.abs(dx) > 50) {
    dx < 0 ? goTo(current + 1) : goTo(current - 1)
  }
})

renderSlides()

</script>
